name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes -d notesdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Run Unit & Integration Tests
        run: dotnet test --no-build -c Release --verbosity normal
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=notesdb;Username=notes;Password=notes_dev_password"

      - name: Verify Docker Build
        run: docker build -t notes-api:ci .
